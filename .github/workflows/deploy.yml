# Builds the site and publishes it to Cloudflare Workers.
#
# Runs on: every push to main (i.e. every merged pull request), a daily schedule
# (so past events roll off without anyone touching the site), and the "Run workflow"
# button in the Actions tab.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  the ministry's Cloudflare account ID
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    # 11:00 UTC daily = 6:00 AM Central during daylight time, 5:00 AM in winter.
    # GitHub cron is always UTC and does not follow daylight-saving changes.
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build site
        # build:preview keeps the clearly labelled sample content in until real content exists.
        # Switch to `npm run build` at launch.
        run: npm run build:preview
        env:
          PUBLIC_SITE_URL: https://sentonesdenton.org

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
